[project]
name = "unhinged"
version = "0.2.0"
description = "Absurd's durable execution engine, ported from Postgres to SQLite."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["durable-execution", "workflow", "sqlite", "queue", "absurd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/amackera/unhinged"
Changelog = "https://github.com/amackera/unhinged/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/amackera/unhinged/blob/main/BENCHMARKS.md"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "pydantic-ai-slim>=2.60,<3; python_version >= '3.11'"]
agent = ["anthropic>=2"]
pydantic-ai = ["pydantic-ai-slim>=2.60,<3; python_version >= '3.11'"]
demo = ["rich>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unhinged"]

[tool.hatch.build.targets.sdist]
include = ["unhinged", "tests", "examples", "docs", "*.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["examples/gauntlet/gauntlet.gif", "examples/gauntlet/demo.tape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
