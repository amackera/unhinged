[project]
name = "unhinged"
version = "0.1.0"
description = "Absurd's durable-execution schema and state machine, ported from Postgres to SQLite."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["anthropic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unhinged"]

[tool.pytest.ini_options]
testpaths = ["tests"]
