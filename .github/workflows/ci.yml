name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e '.[dev]'
      - run: uv run --no-sync python -c "import sqlite3, sys; print(sys.version); print('sqlite', sqlite3.sqlite_version)"
      - run: uv run --no-sync pytest -q
